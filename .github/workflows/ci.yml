# CI/CD : tests à chaque push / PR, image Docker ONNX publiée sur GHCR à chaque push sur main.
# L'image publiée (ghcr.io/<owner>/<repo>:latest) est celle que déploie scripts/deploy_azure.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (GHCR exige des minuscules)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (et push sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-onnx
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test de l'image
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name api --read-only \
            -e API_TOKEN=ci-token \
            -e MODEL_BACKEND=onnx \
            -e ONNX_MODELS_DIR=/models \
            -e AZURE_RUNTIME=true \
            -p 8000:8000 ${{ steps.meta.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          # SPA embarquée (index.html)
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = "200"
          curl -sf localhost:8000/api/models >/dev/null
          python3 -c "from PIL import Image" 2>/dev/null || pip install -q pillow
          python3 -c "from PIL import Image; Image.new('RGB',(320,240),(200,30,30)).save('t.jpg')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@t.jpg localhost:8000/api/predict)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' -F file=@t.jpg localhost:8000/api/predict)" = "200"
