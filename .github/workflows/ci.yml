# CI/CD : tests à chaque push / PR, image Docker ONNX publiée sur GHCR à chaque push sur main.
# L'image publiée (ghcr.io/<owner>/<repo>:latest) est celle que déploie scripts/deploy_azure.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (GHCR exige des minuscules)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (et push sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-onnx
          platforms: linux/amd64
          # PR : load local pour smoke. Main : push GHCR (smoke tire l'image).
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test de l'image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker run -d --name api --read-only \
            -e API_TOKEN=ci-token \
            -e MODEL_BACKEND=onnx \
            -e ONNX_MODELS_DIR=/models \
            -e AZURE_RUNTIME=true \
            -p 8000:8000 "$IMAGE"
          cleanup() { docker rm -f api >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Attendre que le conteneur accepte exec (démarrage uvicorn)
          for i in $(seq 1 30); do
            docker exec api true && break
            sleep 1
          done

          # Présence SPA dans l'image (chemins relatifs à WORKDIR=/srv ; évite la conversion MSYS)
          docker exec api python -c "from pathlib import Path; p=Path('app/static'); assert (p/'index.html').is_file() and (p/'assets').is_dir(), p"

          for i in $(seq 1 30); do
            curl -sf 127.0.0.1:8000/health && break
            sleep 1
          done

          root_code=$(curl -s -o /tmp/spa.html -w '%{http_code}' 127.0.0.1:8000/)
          echo "GET / → $root_code"
          test "$root_code" = "200"
          grep -qi '<html' /tmp/spa.html

          curl -sf 127.0.0.1:8000/api/models >/dev/null

          # JPEG non uniforme : l'aplat (200,30,30) est rejeté 422 par reject_non_object_image
          python3 -c "from PIL import Image" 2>/dev/null || pip install -q pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (320, 240), (40, 40, 40))
          d = ImageDraw.Draw(img)
          d.rectangle((40, 40, 280, 200), fill=(220, 80, 40))
          d.ellipse((100, 80, 220, 180), fill=(30, 140, 220))
          d.line((50, 50, 270, 190), fill=(255, 255, 255), width=4)
          img.save("t.jpg", quality=90)
          PY

          code_401=$(curl -s -o /dev/null -w '%{http_code}' -F file=@t.jpg 127.0.0.1:8000/api/predict)
          echo "POST /api/predict sans token → $code_401"
          test "$code_401" = "401"

          code_200=$(curl -s -o /tmp/predict.json -w '%{http_code}' \
            -H 'Authorization: Bearer ci-token' -F file=@t.jpg 127.0.0.1:8000/api/predict)
          echo "POST /api/predict avec token → $code_200"
          test "$code_200" = "200"
